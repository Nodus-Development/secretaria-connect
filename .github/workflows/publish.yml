name: Publicar en npm

# Se publica al empujar el tag de versión, nunca desde una rama:
#   npm start  →  opción 2
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Lo que hace posible el Trusted Publishing: GitHub emite un OIDC de
      # corta vida que npm verifica contra la configuración del paquete.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      # SIN `registry-url`, y es la línea que hacía fallar el `0.2.0` con un
      # `E404` que mentía. Con ella, setup-node escribe un `.npmrc` con
      # `_authToken=${NODE_AUTH_TOKEN}` y se inventa el relleno
      # `XXXXX-XXXXX-XXXXX-XXXXX`; npm ve que ya tiene credencial, NO arranca
      # el intercambio OIDC y publica con basura, que el registro rechaza como
      # «no encontrado». Sin ella, npm cae al registro por defecto —el mismo—,
      # no encuentra credencial y entonces sí hace el Trusted Publishing.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # El Trusted Publishing pide npm >= 11.5.1, y lo que traiga Node por
      # defecto cambia con cada parche. Actualizarlo es más barato que
      # depurar un 401 que no dice que el problema es la versión del cliente.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # SIN token y SIN `--provenance`, y ninguna de las dos cosas es un
      # olvido. El `0.1.0` se intentó publicar con un Granular Access Token y
      # npm lo rechazó con `E403`: exige 2FA o un token con bypass. Ese bypass
      # existe pero está en retirada —pierde la publicación directa a
      # principios de 2027—, así que en vez de arreglarlo se cambia de camino:
      # con Trusted Publishing no hay secreto que robar ni que rotar, y la
      # procedencia se firma sola por ser repo público.
      #
      # Requiere tener dado de alta el publicador en npmjs.com → el paquete →
      # Settings → Trusted Publisher: organización `Nodus-Development`,
      # repositorio `secretaria-connect`, workflow `publish.yml`.
      - run: npm publish --access public
